<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Entry - HemaScope AI</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#080e1a;
  --card:#0f1c2e;
  --border:rgba(56,140,255,.2);
  --teal:#00d4aa;
  --text:#e8f0fe;
  --text2:#8fa3c0;
}

body{
  margin:0;
  font-family:'Syne',sans-serif;
  background:var(--bg);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:var(--text);
}

.container{
  width:420px;
  background:var(--card);
  padding:30px;
  border-radius:14px;
  border:1px solid var(--border);
}

.title{text-align:center;font-size:20px;font-weight:700}
.sub{text-align:center;font-size:12px;color:var(--text2);margin-bottom:20px}

input{
  width:100%;
  padding:10px;
  margin:10px 0;
  background:#0d1525;
  border:1px solid var(--border);
  border-radius:8px;
  color:white;
}

.radio-group{
  display:flex;
  gap:10px;
  margin:10px 0;
  font-size:12px;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.save{background:var(--teal); color:black;}
.clear{background:#111; color:#aaa;}
</style>
</head>

<body>

<div class="container">
  <div class="title">Patient Entry</div>
  <div class="sub">HemaScope AI System</div>

  <form id="form">

    <input type="text" id="name" placeholder="Name" required>
    <input type="number" id="age" placeholder="Age" required>

    <div class="radio-group">
      <label><input type="radio" name="sex" value="Male" required> Male</label>
      <label><input type="radio" name="sex" value="Female"> Female</label>
      <label><input type="radio" name="sex" value="Others"> Others</label>
    </div>

    <input type="number" id="height" placeholder="Height (cm)" required>
    <input type="number" id="weight" placeholder="Weight (kg)" required>

    <div class="radio-group">
      <label><input type="radio" name="history" value="No" checked> No</label>
      <label><input type="radio" name="history" value="Yes"> Yes</label>
    </div>

    <div id="diseaseBox" style="display:none;">
      <input type="text" id="disease" placeholder="Describe medical issues">
    </div>

    <button type="submit" class="save">Save & Continue</button>
    <button type="button" class="clear" onclick="clearForm()">Clear</button>

  </form>

  
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
/* ---------------- FIREBASE INIT ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyAbH2ub-or4RCJwyQKTb6H13c_jNgS20hQ",
  authDomain: "hemascope-ai-46929.firebaseapp.com",
  projectId: "hemascope-ai-46929",
  storageBucket: "hemascope-ai-46929.appspot.com",
  messagingSenderId: "388661869709",
  appId: "1:388661869709:web:f2e2310a26990cd1fb76c4"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ---------------- UI LOGIC ---------------- */
document.querySelectorAll("input[name='history']").forEach(r=>{
  r.addEventListener("change", function(){
    document.getElementById("diseaseBox").style.display =
      this.value === "Yes" ? "block" : "none";
  });
});

/* ---------------- SAVE PATIENT ---------------- */
document.getElementById("form").addEventListener("submit", async function(e){
  e.preventDefault();

  const name = document.getElementById("name").value;
  const age = document.getElementById("age").value;
  const sex = document.querySelector("input[name='sex']:checked").value;
  const height = document.getElementById("height").value;
  const weight = document.getElementById("weight").value;

  const disease = document.querySelector("input[name='history']:checked").value === "Yes"
    ? document.getElementById("disease").value
    : "None";

  const bmi = (weight / ((height/100)*(height/100))).toFixed(1);

  const patient = {name, age, sex, height, weight, bmi, disease};

 localStorage.setItem("patientData", JSON.stringify(patient));

      // safe redirect
      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 100);
    

  try {
    await db.collection("patients").add({
      ...patient,
      timestamp: Date.now()
    });

    alert("Patient saved successfully!");
    window.location.href = "dashboard.html";

  } catch (err) {
    console.error(err);
    alert("Firebase error — check console");
  }

});

/* ---------------- CLEAR FORM ---------------- */
function clearForm(){
  document.getElementById("form").reset();
  document.getElementById("diseaseBox").style.display="none";
}

/* ---------------- CSV UPLOAD ---------------- */

</script>

</body>
</html>
